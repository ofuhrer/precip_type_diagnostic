[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "precip-type-diag"
version = "0.4.0"
description = "Selectable original Firdewsa and ICON-adapted precipitation-type diagnostic."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=2.4,<2.5",
  "numba>=0.66,<0.67",
  "earthkit-data>=1.0,<1.1",
  "eccodes>=2.47,<2.48",
  "netCDF4>=1.7,<1.8",
]

[project.scripts]
precip-type-diag = "precip_type_diag.__main__:main"
precip-type-diag-realtime = "precip_type_diag.realtime:main"
precip-type-diag-backfill = "precip_type_diag.backfill:main"

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
]
dev = [
  "mypy>=1.14,<1.20",
  "ruff>=0.8,<0.14",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
precip_type_diag = [
  "definitions/grib2/localConcepts/default/*.def",
  "definitions/grib2/localConcepts/ecmf/*.def",
  "definitions/grib2/localConcepts/edzw/*.def",
  "definitions/grib2/localConcepts/lssw/*.def",
  "definitions/grib2/tables/32/*.table",
]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",
  "B905",
  "UP017",
]

[tool.ruff.lint.isort]
known-first-party = ["precip_type_diag"]

[tool.mypy]
python_version = "3.11"
files = ["src/precip_type_diag"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[tool.coverage.run]
omit = [
  "src/precip_type_diag/benchmark.py",
  "src/precip_type_diag/icon_numba_backend.py",
  "src/precip_type_diag/numba_backend.py",
]
